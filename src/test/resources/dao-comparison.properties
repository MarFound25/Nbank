# DAO Comparison Rules
# Format: fully.qualified.ClassName=apiField:daoField,apiField2:daoField2

# Account related
AccountResponce=accountId:id,balance:balance,ownerId:ownerId,accountType:accountType

CreateUserResponse=id:id,username:username,name:name,role:role
ProfileResponse=id:id,username:username,name:name,role:role
LoginUserResponse=token:token,userId:id
UserListResponse=users:users,totalCount:totalCount

# Transaction related
TransferResponse=transactionId:id,amount:amount,fromAccount:fromAccountId,toAccount:toAccountId
DepositResponse=transactionId:id,amount:amount,accountId:accountId,newBalance:balance