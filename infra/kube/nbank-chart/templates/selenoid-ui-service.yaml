apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.selenoidUi.name }}
  labels:
    app: {{ .Values.selenoidUi.name }}
spec:
  selector:
    app: {{ .Values.selenoidUi.name }}
  type: {{ .Values.selenoidUi.serviceType }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.selenoidUi.servicePort }}
      targetPort: {{ .Values.selenoidUi.containerPort }}
      {{- if and (eq .Values.selenoidUi.serviceType "NodePort") .Values.selenoidUi.nodePort }}
      nodePort: {{ .Values.selenoidUi.nodePort }}
      {{- end }}
