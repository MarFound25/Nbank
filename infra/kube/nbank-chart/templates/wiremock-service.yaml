apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.wiremock.name }}
  labels:
    app: {{ .Values.wiremock.name }}
spec:
  selector:
    app: {{ .Values.wiremock.name }}
  type: {{ .Values.wiremock.serviceType }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.wiremock.servicePort }}
      targetPort: {{ .Values.wiremock.containerPort }}
