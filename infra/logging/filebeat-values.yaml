daemonset:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

deployment:
  enabled: false

filebeatConfig:
  filebeat.yml: |
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          hints.enabled: true
          hints.default_config.enabled: false
          templates:
            - condition:
                equals:
                  kubernetes.labels.app: backend
              config:
                - type: container
                  paths:
                    - /var/log/containers/*-${data.kubernetes.container.id}.log
                  processors:
                    - add_kubernetes_metadata:
                        host: ${NODE_NAME}
                        matchers:
                          - logs_path:
                              logs_path: "/var/log/containers/"
                    - decode_json_fields:
                        fields: ["message"]
                        target: ""
                        overwrite_keys: true
                        add_error_key: true
    processors:
      - add_cloud_metadata: ~
      - add_host_metadata: ~
    output.elasticsearch:
      hosts: ["http://elasticsearch-master:9200"]
      index: "nbank-logs-%{+yyyy.MM.dd}"
    setup.ilm.enabled: false
    setup.template.name: "nbank-logs"
    setup.template.pattern: "nbank-logs-*"
