replicas: 1
minimumMasterNodes: 1
antiAffinity: soft

clusterHealthCheckParams: wait_for_status=yellow&timeout=1s

esJavaOpts: -Xmx512m -Xms512m

resources:
  requests:
    cpu: 100m
    memory: 768Mi
  limits:
    cpu: 1000m
    memory: 1536Mi

volumeClaimTemplate:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

protocol: http
createCert: false

esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    xpack.security.http.ssl.enabled: false
    xpack.security.transport.ssl.enabled: false

secret:
  enabled: true
  password: "changeme"

sysctlInitContainer:
  enabled: false
