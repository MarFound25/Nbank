name: Run tests and publish reports

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/run-tests.yml'
      - 'infra/docker_compose/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/run-tests.yml'
      - 'infra/docker_compose/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build-and-push:
    name: Maven build, Checkstyle, Docker Hub push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Build project
        run: mvn -B clean compile -q

      - name: Run Checkstyle
        run: mvn -B checkstyle:check

      - name: Prepare image name
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          USERNAME=$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')
          echo "image=${USERNAME}/nbank-tests:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t "${{ steps.meta.outputs.image }}" .

      - name: Push Docker image
        run: docker push "${{ steps.meta.outputs.image }}"

  api-tests-and-reports:
    name: API tests, Allure, Swagger coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Download Swagger Coverage CLI
        run: |
          curl -sL -o swagger-coverage-1.5.0.zip \
            https://github.com/viclovsky/swagger-coverage/releases/download/1.5.0/swagger-coverage-1.5.0.zip
          unzip -q swagger-coverage-1.5.0.zip
          EXTRACTED=$(find . -maxdepth 1 -type d -name 'swagger-coverage*' | head -n 1)
          mv "$EXTRACTED" .swagger-coverage-commandline
          chmod +x .swagger-coverage-commandline/bin/swagger-coverage-commandline
          rm -f swagger-coverage-1.5.0.zip
          test -x .swagger-coverage-commandline/bin/swagger-coverage-commandline

      - name: Start docker compose stack
        run: |
          cd infra/docker_compose
          docker compose up -d
          echo "Waiting for backend..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4112/v3/api-docs > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            if [ $((i % 6)) -eq 0 ]; then
              echo "Still waiting... ($i)"
              docker compose ps || true
            fi
            sleep 5
          done
          echo "Backend did not become ready in time"
          docker compose ps
          docker compose logs
          exit 1

      - name: Run API tests
        id: api_tests
        continue-on-error: true
        run: |
          mvn -B -Papi clean test \
            -Dapi.base.url=http://localhost:4112 \
            -Ddb.url=jdbc:postgresql://localhost:5433/nbank \
            -Ddb.username=postgres \
            -Ddb.password=postgres

      - name: Run Swagger coverage
        if: always()
        id: swagger_coverage
        continue-on-error: true
        run: |
          if [ ! -d target/swagger-coverage-output ]; then
            echo "No coverage output directory — API tests may not have produced calls"
            mkdir -p target/swagger-coverage-output
          fi
          .swagger-coverage-commandline/bin/swagger-coverage-commandline \
            -s http://localhost:4112/v3/api-docs \
            -i target/swagger-coverage-output
          ls -la swagger-coverage-report.html swagger-coverage-results.json || true

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      # Required Pages layout:
      #   test-report/<run>/allure-report
      #   test-report/<run>/swagger-coverage
      - name: Package GitHub Pages site
        if: always()
        run: |
          set -euo pipefail
          RUN="${{ github.run_number }}"
          sudo chown -R "$(id -u):$(id -g)" allure-history allure-report 2>/dev/null || true

          mkdir -p site
          if [ -d gh-pages/test-report ]; then
            cp -a gh-pages/test-report site/
          fi
          if [ -d gh-pages/last-history ]; then
            cp -a gh-pages/last-history site/
          fi

          mkdir -p "site/test-report/${RUN}/allure-report"
          mkdir -p "site/test-report/${RUN}/swagger-coverage"

          if [ -d "allure-history/${RUN}" ]; then
            cp -a "allure-history/${RUN}/." "site/test-report/${RUN}/allure-report/"
          elif [ -d allure-report ]; then
            cp -a allure-report/. "site/test-report/${RUN}/allure-report/"
          else
            echo "WARN: Allure report directory not found"
          fi

          chmod +x scripts/generate-coverage-widget.sh scripts/check-api-coverage.sh
          ./scripts/generate-coverage-widget.sh \
            swagger-coverage-results.json \
            "site/test-report/${RUN}/allure-report/widgets/coverage.json"

          if [ -f swagger-coverage-report.html ]; then
            cp swagger-coverage-report.html "site/test-report/${RUN}/swagger-coverage/index.html"
          else
            echo "WARN: swagger-coverage-report.html not found"
            echo '<html><body><h1>Swagger coverage report missing</h1></body></html>' \
              > "site/test-report/${RUN}/swagger-coverage/index.html"
          fi
          if [ -f swagger-coverage-results.json ]; then
            cp swagger-coverage-results.json "site/test-report/${RUN}/swagger-coverage/"
          fi

          if [ -d allure-history/last-history ]; then
            rm -rf site/last-history
            cp -a allure-history/last-history site/
          fi

          # Keep last 20 pipeline report folders
          if [ -d site/test-report ]; then
            cd site/test-report
            ls -1 | sort -n | head -n -20 | xargs -r rm -rf
            cd "${GITHUB_WORKSPACE}"
          fi

          {
            echo "<!DOCTYPE html>"
            echo "<html><head><meta charset=\"utf-8\"><title>Nbank test reports</title></head><body>"
            echo "<h1>Nbank test reports</h1>"
            echo "<p>Latest run: <strong>#${RUN}</strong></p>"
            echo "<ul>"
            echo "<li><a href=\"test-report/${RUN}/allure-report/\">Allure Report (#${RUN})</a></li>"
            echo "<li><a href=\"test-report/${RUN}/swagger-coverage/\">Swagger / API Coverage (#${RUN})</a></li>"
            echo "</ul>"
            echo "<h2>All runs</h2><ul>"
            if [ -d site/test-report ]; then
              for d in $(ls -1 site/test-report | sort -nr); do
                echo "<li>#${d}: <a href=\"test-report/${d}/allure-report/\">allure</a> | <a href=\"test-report/${d}/swagger-coverage/\">swagger-coverage</a></li>"
              done
            fi
            echo "</ul></body></html>"
          } > site/index.html

          touch site/.nojekyll
          echo "Packaged site for run #${RUN}:"
          find "site/test-report/${RUN}" -maxdepth 2 -type f | head -n 40

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always() && (github.ref == 'refs/heads/run-tests-pipeline' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site

      - name: Quality gate — API coverage ≥ 50%
        id: coverage_gate
        if: always()
        run: |
          ./scripts/check-api-coverage.sh \
            "site/test-report/${{ github.run_number }}/allure-report/widgets/coverage.json" \
            50

      - name: Clean up services
        if: always()
        run: cd infra/docker_compose && docker compose down

      - name: Fail job if tests or coverage gate failed
        if: always() && (steps.api_tests.outcome == 'failure' || steps.coverage_gate.outcome == 'failure' || steps.swagger_coverage.outcome == 'failure')
        run: |
          echo "api_tests=${{ steps.api_tests.outcome }}"
          echo "swagger_coverage=${{ steps.swagger_coverage.outcome }}"
          echo "coverage_gate=${{ steps.coverage_gate.outcome }}"
          exit 1
